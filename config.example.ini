; ===================== 校园网配置（模板） =====================
; 复制本文件为 config.ini 后填入真实账号密码。
; config.ini 已在 .gitignore 里，不会被提交。
; 注意：密码是明文保存的，请只放在你自己的电脑上。

; ---------- 有线 PPPoE（dial.ps1 用） ----------

; 拨号入口名字：Windows「网络连接」里那个宽带连接的名称
ENTRY=宽带连接

ACCOUNT=你的宽带账号
PASSWORD=你的宽带密码

; 断线自动重连：后台每多少秒检查一次
RETRY_SECONDS=20

; 拨号成功后是否启动后台自动重连监控：1=启动，0=不启动
WATCHER=1

; ---------- WiFi 门户认证（wifi.ps1 用，不填就用默认值） ----------

; 无线配置文件名 / 网卡名字（HIT-WLAN 是开放式、无 WPA 密钥，认证只在门户做）
; WLAN_PROFILE=HIT-WLAN
; WLAN_ALIAS=WLAN

; 留空则复用上面的 ACCOUNT / PASSWORD；无线想用不同账号再单独填
; WLAN_ACCOUNT=
; WLAN_PASSWORD=

; 认证服务器地址；如果 status 扫到的门户地址和这个不一样，用它覆盖
; EPORTAL_BASE=http://202.118.253.94:8080
