; ===================== 宽带拨号配置（模板） =====================
; 复制本文件为 config.ini 后填入真实账号密码。
; config.ini 已在 .gitignore 里，不会被提交。
; 注意：密码是明文保存的，请只放在你自己的电脑上。

; 拨号入口名字：Windows「网络连接」里那个宽带连接的名称
ENTRY=宽带连接

ACCOUNT=你的宽带账号
PASSWORD=你的宽带密码

; 断线自动重连：后台每多少秒检查一次
RETRY_SECONDS=20

; 拨号成功后是否启动后台自动重连监控：1=启动，0=不启动
WATCHER=1
